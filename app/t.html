var TH = { d: null, testId: null, mode: 'view', form: null, open: null, confirm: '', msg: '', msgCls: '', proxyName: null, nick: {} };

function h5Reset() { TH.d = null; TH.testId = null; TH.mode = 'view'; TH.form = null; TH.open = null; TH.confirm = ''; TH.msg = ''; TH.nick = {}; }

TH.cache = {};
function h5Load(keepMsg) {
  if (!keepMsg) TH.msg = '';
  var code = T.d.cls.code;
  if (!TH.d && !TH.testId && TH.cache[code]) { TH.d = TH.cache[code]; TH.testId = TH.d.test ? TH.d.test.id : null; }   // 받아 둔 것 먼저
  google.script.run.withSuccessHandler(function (r) {
    if (T.d.cls.code !== code) return;
    if (!r || !r.ok) { TH.d = null; TH.msg = r ? r.message : '오류가 발생했어요.'; TH.msgCls = 'red'; render(); return; }
    TH.d = r; TH.testId = r.test ? r.test.id : null; TH.cache[code] = r; render();
  }).withFailureHandler(function (e) { TH.msg = '연결 오류: ' + (e && e.message ? e.message : ''); TH.msgCls = 'red'; render(); })
    .apiTeacherH5(KEY, T.d.cls.code, TH.testId || '');

/** 서버 작업 공통: 저장 → 성공 문구 → 다시 불러오기 */
function h5Call(fn, args, okMsg, after) {
  TH.msg = '저장하는 중…'; TH.msgCls = 'muted'; render();
  var run = google.script.run.withSuccessHandler(function (r) {
    if (r && r.ok) {
      TH.msg = okMsg; TH.msgCls = 'green'; if (after) after(r);
      if (r.d && r.d.ok) {   // v8: 저장 응답에 새 H5 데이터가 같이 옴 → 요청 없이 바로
        TH.d = r.d; TH.testId = r.d.test ? r.d.test.id : null;
        if (!r.d.test || !r.d.tests.length || r.d.tests[0].id === r.d.test.id) TH.cache[T.d.cls.code] = r.d;
        render();
      } else h5Load(true);
    }
    else { TH.msg = (r && r.message) || '저장하지 못했어요.'; TH.msgCls = 'red'; render(); }
  }).withFailureHandler(function (e) { TH.msg = '연결 오류: ' + (e && e.message ? e.message : ''); TH.msgCls = 'red'; render(); });
  run[fn].apply(run, [KEY, T.d.cls.code].concat(args));
}

function h5MsgEl() { return TH.msg ? h('div', { 'class': 'msg ' + TH.msgCls, text: TH.msg }) : null; }

function h5Tab() {
  var wrap = h('div');
  if (!TH.d) { wrap.appendChild(h('div', { 'class': 'card center', text: TH.msg || '불러오는 중…' })); return wrap; }
  var D = TH.d, t = D.test;
  var top = h('div', { 'class': 'card' }, [
    h('button', { 'class': 'refresh', text: '새로고침', onclick: function () { h5Load(); } }),
    h('div', { 'class': 'big', text: D.title + ' · ' + T.d.cls.name })
  ]);
  if (D.tests.length) {
    var sel = h('select', { onchange: function () { TH.testId = sel.value; TH.mode = 'view'; TH.form = null; TH.open = null; TH.confirm = ''; h5Load(); } });
    D.tests.forEach(function (x) { var o = h('option', { value: x.id, text: x.label }); if (t && x.id === t.id) o.selected = true; sel.appendChild(o); });
    top.appendChild(sel);
  } else top.appendChild(h('div', { 'class': 'sub', style: 'margin-top:6px', text: '아직 등록한 ' + D.title + '가 없어요. 수업 전에 정답 5개를 등록해 두세요.' }));
  if (TH.mode === 'view') top.appendChild(h('button', { 'class': 'b pri', style: 'width:100%;margin-top:10px', text: '+ 새 ' + D.title + ' 등록', onclick: function () { h5StartForm(null); } }));
  wrap.appendChild(top);

  if (TH.mode === 'new' || TH.mode === 'edit') { wrap.appendChild(h5FormCard()); return wrap; }
  if (TH.mode === 'proxy') { wrap.appendChild(h5ProxyCard()); return wrap; }
  if (t) {
    wrap.appendChild(h5TestCard());
    if (t.live) wrap.appendChild(h5StudentsCard());
  } else if (TH.msg) top.appendChild(h5MsgEl());
  if (D.cum && D.cum.tests) wrap.appendChild(h5CumCard());
  return wrap;
}

function h5StartForm(test) {
  TH.mode = test ? 'edit' : 'new'; TH.msg = ''; TH.confirm = '';
  TH.form = {
    title: test ? test.title : '', pdf: test ? test.pdf : '',
    ans: { vals: (test ? test.answers : ['', '', '', '', '']).map(uiAns), cur: 0 }
  };
  render(); window.scrollTo(0, 0);
}

function h5FormCard() {
  var F = TH.form, edit = TH.mode === 'edit', t = TH.d.test, D = TH.d;
  var title = h('input', { type: 'text', maxlength: '40', placeholder: '예: 순열 복습 (선택)' });
  title.value = F.title; title.oninput = function () { F.title = title.value; };
  var pdf = h('input', { type: 'text', placeholder: 'https://drive.google.com/… (선택, 나중에 넣어도 돼요)' });
  pdf.value = F.pdf; pdf.oninput = function () { F.pdf = pdf.value; };
  return h('div', { 'class': 'card' }, [
    h('button', { 'class': 'back', text: '← 취소', onclick: function () { TH.mode = 'view'; TH.form = null; TH.msg = ''; render(); } }),
    h('div', { 'class': 'big', text: edit ? '정답·PDF 고치기' : '새 ' + D.title + ' 등록 · ' + T.d.cls.name }),
    h('div', { 'class': 'sub', text: edit ? (t.live ? '정답을 고치면 이미 낸 학생도 자동으로 다시 채점돼요.' : '아직 시작 전이에요.') : '저장하면 준비 상태로 남아요. 학생에게는 [시작]을 눌러야 보여요.' }),
    h('label', { text: '제목' }), title,
    h('label', { text: '정답 5개 (문항마다 숫자 / ㄱㄴㄷ 선택 · 학생과 같은 버튼)' }), uiAnsForm(F.ans, render, true),
    h('label', { text: '문제·해설 PDF 링크 (드라이브 공유 링크)' }), pdf,
    h('button', { 'class': 'b pri', style: 'width:100%;margin-top:14px', text: '저장', onclick: function () {
      var bad = [];
      F.ans.vals.forEach(function (x, k) { if (uiIsEmpty(x) || uiAnsErr(x)) bad.push((k + 1) + '번'); });
      if (bad.length) { TH.msg = bad.join(', ') + ' 정답을 확인해 주세요.'; TH.msgCls = 'red'; render(); return; }
      h5Call('apiTeacherH5Save', [edit ? t.id : '', F.title, F.ans.vals.map(uiKeyText), F.pdf],
        edit ? '고쳤어요.' : '등록했어요. 시험지를 나눠 줄 때 [시작]을 누르세요.',
        function (r) { TH.testId = r.id; TH.mode = 'view'; TH.form = null; });
    } }),
    h5MsgEl()
  ]);
}

function h5TestCard() {
  var D = TH.d, t = D.test, st = D.stat, kids = [];
  kids.push(h('div', { 'class': 'hl' }, [h('span', { text: t.title || '(제목 없음)' }), h('span', { 'class': 'prog ' + (!t.live ? 'y' : t.today ? 'g' : 'n'), text: !t.live ? '준비' : t.today ? '진행 중' : '종료' })]));
  kids.push(h('div', { 'class': 'sub', text: t.live ? t.startText + ' 시작' : '등록 ' + t.createdText + ' · 학생에게는 아직 안 보여요' }));
  var g = h('div', { 'class': 'ansg' });
  t.answers.forEach(function (x, k) {
    g.appendChild(h('div', { 'class': 'ag' }, [
      h('div', { 'class': 'sub', text: (k + 1) + '번' }),
      h('div', { 'class': 'agv' }, [uiMath(uiAns(x), false)]),
      chParse(x) ? h('div', { 'class': 'sub chn', text: 'ㄱ~' + chLetters().charAt(chParse(x).n - 1) }) : null,
      t.live && st.count ? h('div', { 'class': 'agr', text: '정답률 ' + st.rate[k] + '%' }) : null
    ]));
  });
  kids.push(g);
  if (t.live) {
    kids.push(h('div', { 'class': 'metrics' }, [
      h('div', { 'class': 'm' }, [h('b', { text: st.count + '/' + st.total }), h('span', { text: '응시' })]),
      h('div', { 'class': 'm' }, [h('b', { text: String(st.avg) }), h('span', { text: '평균' })]),
      h('div', { 'class': 'm' }, [h('b', { text: String(st.full) }), h('span', { text: '만점' })])
    ]));
    if (st.count) kids.push(h('div', { 'class': 'line', text: '점수별: ' + st.dist.filter(function (x) { return x.n; }).map(function (x) { return x.score + '점 ' + x.n + '명'; }).join(' · ') }));
    kids.push(h('div', { 'class': 'line ' + (st.missing.length ? 'red' : 'green'), text: '미응시: ' + (st.missing.length ? st.missing.join(', ') : '없음') }));
  }
  kids.push(t.pdf ? h('a', { 'class': 'line', href: t.pdf, target: '_blank', rel: 'noopener', text: '📄 문제·해설 PDF 열기' })
    : h('div', { 'class': 'line amber', text: "PDF 링크가 아직 없어요. '정답·PDF 고치기'에서 넣으면 제출한 학생에게 바로 보여요." }));

  var btns = [];
  if (!t.live) btns.push(h('button', { 'class': 'b ' + (TH.confirm === 'start' ? 'warn' : 'pri'), style: 'grid-column:span 2', text: TH.confirm === 'start' ? '한 번 더 누르면 시작' : '▶ 시작 (시험지 나눠 줄 때)', onclick: function () {
    if (TH.confirm !== 'start') { TH.confirm = 'start'; TH.msg = '학생 화면 맨 위에 바로 나타나요. 한 번 더 눌러 주세요.'; TH.msgCls = 'amber'; render(); return; }
    TH.confirm = ''; h5Call('apiTeacherH5Start', [t.id], '시작했어요. 학생 화면 맨 위에 나타났어요.');
  } }));
  btns.push(h('button', { 'class': 'b', text: '정답·PDF 고치기', onclick: function () { h5StartForm(t); } }));
  if (D.classes.length) btns.push(h('button', { 'class': 'b', text: '다른 반에도 등록', onclick: function () { TH.confirm = TH.confirm === 'copy' ? '' : 'copy'; TH.msg = ''; render(); } }));
  if (!t.live || !st.count) btns.push(h('button', { 'class': 'b ' + (TH.confirm === 'del' ? 'warn' : ''), text: TH.confirm === 'del' ? '한 번 더 누르면 삭제' : '삭제', onclick: function () {
    if (TH.confirm !== 'del') { TH.confirm = 'del'; TH.msg = '이 테스트를 지워요.'; TH.msgCls = 'amber'; render(); return; }
    TH.confirm = ''; h5Call('apiTeacherH5Delete', [t.id], '삭제했어요.', function () { TH.testId = null; });
  } }));
  kids.push(h('div', { 'class': 'btns' }, btns));
  if (TH.confirm === 'copy') {
    var row = h('div', { 'class': 'copyr' });
    D.classes.forEach(function (c) {
      row.appendChild(h('button', { 'class': 'b', text: c.name + '에 등록', onclick: function () { TH.confirm = ''; h5Call('apiTeacherH5Copy', [t.id, c.code], c.name + '에 준비 상태로 등록했어요. 그 반에서 [시작]을 누르세요.'); } }));
    });
    kids.push(h('div', { 'class': 'line muted', text: '같은 제목·정답·PDF로 준비 상태로 만들어져요.' }));
    kids.push(row);
  }
  if (!TH.open) kids.push(h5MsgEl());
  return h('div', { 'class': 'card' }, kids);
}

function h5StudentsCard() {
  var D = TH.d, c = h('div', { 'class': 'card' }, [h('div', { 'class': 'sub', style: 'margin-bottom:4px', text: '이름을 누르면 답 확인 · 대신 입력 · 제출 취소 · 닉네임 변경' })]);
  D.students.forEach(function (s) {
    var open = TH.open === s.name;
    c.appendChild(h('div', { 'class': 'sr clk', onclick: function () { TH.open = open ? null : s.name; TH.confirm = ''; TH.msg = ''; render(); } }, [
      h('span', { 'class': 'n', text: s.name }),
      h('span', { 'class': 'v' }, [
        s.submitted ? h('b', { text: s.score + '점  ' }) : h('span', { 'class': 'red', text: '미응시  ' }),
        s.submitted ? h('span', { 'class': 'okx', text: s.marks.map(function (m) { return m ? '○' : '×'; }).join(' ') }) : null,
        h('span', { 'class': 'muted', text: '  ' + (s.nick || '닉네임 없음') })
      ]),
      s.time ? h('span', { 'class': 'tm', text: (s.by === '선생님' ? '대신 입력 · ' : '') + s.time }) : null
    ]));
    if (open) c.appendChild(h5StuPanel(s));
  });
  return c;
}

function h5StuPanel(s) {
  var t = TH.d.test, p = h('div', { 'class': 'panel2' });
  if (s.submitted) {
    var g = h('div', { 'class': 'ansg', style: 'margin-top:0' });
    s.answers.forEach(function (x, k) {
      g.appendChild(h('div', { 'class': 'ag ' + (s.marks[k] ? 'agok' : 'agng') }, [
        h('div', { 'class': 'sub', text: (k + 1) + '번 ' + (s.marks[k] ? '○' : '×') }),
        h('div', { 'class': 'agv' }, [x ? uiMath(uiAns(x), false) : h('span', { 'class': 'muted', text: '빈칸' })])
      ]));
    });
    p.appendChild(g);
    var cc = TH.confirm === 'cancel';
    p.appendChild(h('button', { 'class': 'b ' + (cc ? 'warn' : ''), style: 'width:100%;margin-top:10px', text: cc ? '한 번 더 누르면 제출 취소' : '제출 취소', onclick: function () {
      if (!cc) { TH.confirm = 'cancel'; TH.msg = s.name + ' 학생의 제출을 지워요. 학생이 다시 응시할 수 있어요.'; TH.msgCls = 'amber'; render(); return; }
      TH.confirm = ''; h5Call('apiTeacherH5Cancel', [t.id, s.name], s.name + ' 학생의 제출을 취소했어요.');
    } }));
  } else {
    p.appendChild(h('button', { 'class': 'b pri', style: 'width:100%', text: '대신 입력 (시험지 보고)', onclick: function () {
      TH.mode = 'proxy'; TH.proxyName = s.name; TH.msg = '';
      TH.form = { ans: { vals: t.answers.map(function (x) { var c = chParse(x); return uiBlank(c ? c.n : 0); }), cur: 0 } };
      render(); window.scrollTo(0, 0);
    } }));
  }
  var inp = h('input', { type: 'text', maxlength: '8', placeholder: '닉네임 2~8자' });
  inp.value = TH.nick[s.name] != null ? TH.nick[s.name] : s.nick;
  inp.oninput = function () { TH.nick[s.name] = inp.value; };
  p.appendChild(h('label', { text: '닉네임' + (s.nick ? '' : ' (아직 없음)') }));
  p.appendChild(inp);
  p.appendChild(h('div', { 'class': 'btns', style: 'margin-top:8px' }, [
    h('button', { 'class': 'b', text: '닉네임 저장', onclick: function () { h5Call('apiTeacherH5Nick', [s.name, inp.value], '닉네임을 바꿨어요.', function () { delete TH.nick[s.name]; }); } }),
    h('button', { 'class': 'b', text: '닉네임 초기화', onclick: function () { h5Call('apiTeacherH5Nick', [s.name, ''], '닉네임을 지웠어요. 다음에 들어오면 다시 정해요.', function () { delete TH.nick[s.name]; }); } })
  ]));
  var m = h5MsgEl();
  if (m) p.appendChild(m);
  return p;
}

function h5ProxyCard() {
  var t = TH.d.test, name = TH.proxyName, F = TH.form;
  return h('div', { 'class': 'card' }, [
    h('button', { 'class': 'back', text: '← 돌아가기', onclick: function () { TH.mode = 'view'; TH.form = null; TH.msg = ''; render(); } }),
    h('div', { 'class': 'big', text: name + ' · 대신 입력' }),
    h('div', { 'class': 'sub', text: '시험지에 적힌 답을 입력하세요. 빈칸은 틀린 것으로 처리돼요.' }),
    uiAnsForm(F.ans, render),
    h('button', { 'class': 'b pri', style: 'width:100%;margin-top:14px', text: '저장', onclick: function () {
      var bad = [];
      F.ans.vals.forEach(function (x, k) { if (uiAnsErr(x)) bad.push((k + 1) + '번'); });
      if (bad.length) { TH.msg = bad.join(', ') + ' 답을 확인해 주세요.'; TH.msgCls = 'red'; render(); return; }
      h5Call('apiTeacherH5Proxy', [t.id, name, F.ans.vals.map(uiAnsText)], name + ' 학생 답을 저장했어요.',
        function () { TH.mode = 'view'; TH.form = null; TH.open = name; });
    } }),
    h5MsgEl()
  ]);
}

function h5CumCard() {
  var C = TH.d.cum, tb = h('table', { 'class': 'tbl' });
  tb.appendChild(h('tr', null, ['학생', '닉네임', '응시', '평균', '만점'].map(function (x) { return h('th', { text: x }); })));
  C.rows.forEach(function (r) {
    tb.appendChild(h('tr', null, [
      h('td', { text: r.name }), h('td', { 'class': 'muted', text: r.nick || '-' }),
      h('td', { text: r.taken + '/' + r.of }), h('td', { text: r.avg }), h('td', { text: String(r.full) })
    ]));
  });
  return h('div', { 'class': 'card' }, [
    h('div', { 'class': 'sub', text: '누적 · 시작한 ' + TH.d.title + ' ' + C.tests + '회 기준 (학생 등록일 이후) · 평균은 응시한 회차만' }),
    h('div', { 'class': 'scroll', style: 'margin-top:8px' }, [tb])
  ]);
}

function copy(text) {
  T.justStarted = false;
  function done(ok) { T.msg = ok ? '복사했어요.' : '복사가 안 되면 글자를 길게 눌러 직접 복사하세요.'; T.msgCls = ok ? 'green' : 'amber'; render(); }
  function fallback() {
    try {
      var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      var ok = document.execCommand('copy'); document.body.removeChild(t); return ok;
    } catch (e) { return false; }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
    else done(fallback());
  } catch (e) { done(fallback()); }
}

load();
</script></body></html>
