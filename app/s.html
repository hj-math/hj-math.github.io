      S.saved = prevSaved;
      authLost(r);
    } else if (r && (r.reason === 'round' || r.reason === 'closed')) {   // v9: 'closed' = 자정이 지나 수업일이 끝남 → 다시 불러와 보기만 화면
      center(r.message); setTimeout(start, 1500);
    } else {
      undo('⚠️ 제출이 저장되지 않았어요. ' + ((r && r.message) || '다시 눌러 주세요.'));
    }
  }).withFailureHandler(function () {
    S.busy = false; S.optim = false; undo('⚠️ 제출이 저장되지 않았어요. 인터넷 연결을 확인하고 다시 눌러 주세요.');
  }).apiSubmit(CODE, S.d.round.id, S.name, S.progress, items, S.tok);
}

start();
</script></body></html>
